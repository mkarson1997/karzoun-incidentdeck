name: Temporary formatter repair

on:
  push:
    branches:
      - feat/incidentdeck-v0.1-offline-core

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/incidentdeck-v0.1-offline-core

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Apply Dart formatter and push exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test
          if git diff --quiet -- lib test; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          git commit -m 'style: apply Dart formatter'
          git push origin HEAD:feat/incidentdeck-v0.1-offline-core
