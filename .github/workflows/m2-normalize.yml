name: Milestone 2 normalize

on:
  push:
    branches:
      - feat/local-durability-operational-ux

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/local-durability-operational-ux

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve and normalize
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib test
          git add pubspec.lock lib test
          if git diff --cached --quiet; then
            echo 'No normalization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: normalize Dart sources and dependency lock'
          git push origin HEAD:feat/local-durability-operational-ux
